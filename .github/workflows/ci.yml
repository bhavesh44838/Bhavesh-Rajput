name: Python CI Pipeline

on:
  push:
    branches: [develop]
    paths:
      - "app.py"
      - "tests/**"

  pull_request:
    branches: [develop]

  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions needed for checkout.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run Pytest
        run: python -m pytest -q

  deploy:
    name: SSH Deployment
    needs: lint-test
    runs-on: ubuntu-latest

    # Deploy only when manually started on the develop branch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'

    # Configure this environment in Settings > Environments.
    # Add SSH_PRIVATE_KEY as an environment secret and SERVER_IP as
    # an environment variable in the staging environment.
    environment: staging

    steps:
      - name: Connect to Ubuntu VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_IP }}
          username: frappe
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Successfully connected to Ubuntu!"
            whoami
            hostname
            uptime
