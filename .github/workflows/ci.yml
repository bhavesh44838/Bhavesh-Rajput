name: Python CI Pipeline

on:
  push:
    branches:
      - develop
      - feature/github-actions

  pull_request:
    branches:
      - develop

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ruff pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q
